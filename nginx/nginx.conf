# nginx/nginx.conf
# Main reverse proxy — sits in front of everything
# Routes:
#   /api/*  and  /ws/*  → Django backend (port 8000)
#   everything else     → React frontend (port 3000 in container)

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Max upload size (for PO attachments etc)
        client_max_body_size 20M;

        # ── API requests → Django ──────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Required for HttpOnly cookie auth
            proxy_pass_header  Set-Cookie;
        }

        # ── WebSocket → Django Channels ────────────
        location /ws/ {
            proxy_pass             http://backend;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     86400;      # keep WS alive
        }

        # ── Django admin ───────────────────────────
        location /admin/ {
            proxy_pass       http://backend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
        }

        # ── Static files (Django collectstatic) ───
        location /static/ {
            alias /static/;
            expires 1y;
        }

        # ── Media files (uploaded PO attachments) ─
        location /media/ {
            alias /media/;
        }

        # ── Everything else → React frontend ───────
        location / {
            proxy_pass       http://frontend;
            proxy_set_header Host            $host;
        }
    }
}